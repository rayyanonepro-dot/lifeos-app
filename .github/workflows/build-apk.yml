name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare www directory
        run: |
          mkdir -p www
          if [ -d "assets" ]; then cp -r assets www/; fi
          if [ -f "index.html" ]; then cp index.html www/; fi
          if [ -f "favicon.svg" ]; then cp favicon.svg www/; fi
          if [ -f "opengraph.jpg" ]; then cp opengraph.jpg www/; fi

      - name: Install dependencies
        run: npm install

      - name: Initialize Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
